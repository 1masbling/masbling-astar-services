    <style>
        :root {

            --card-blue: #112233;
            --bg-dark: #031525;
            --text-white: #ffffff;
            --text-muted: #b5c2b7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-white); padding-bottom: 90px; }

        .menu-icon { font-size: 1.5rem; color: var(--text-white); cursor: pointer; }

        .trust-tag { display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.15); padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.9rem; color: var(--accent-yellow); margin-bottom: 1.5rem; font-weight: bold; }

        .button-stack { display: flex; flex-direction: column; gap: 0.8rem; max-width: 450px; margin: 0 auto 2.5rem auto; }
        .btn-yellow { background: var(--accent-yellow); color: #000000; font-weight: bold; padding: 1rem; border-radius: 8px; text-decoration: none; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-transform: uppercase; border: none; }
        .btn-outline-blue { background: rgba(29, 112, 184, 0.2); color: #ffffff; font-weight: bold; padding: 1rem; border-radius: 8px; text-decoration: none; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 0.7rem; border: 2px solid var(--btn-blue); }
        .btn-solid-blue { background: #124076; color: #ffffff; font-weight: bold; padding: 1rem; border-radius: 8px; text-decoration: none; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border: 1px solid rgba(255,255,255,0.1); }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .section-title { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; margin: 3rem 0 1.5rem 0; letter-spacing: 0.5px; text-align: center; color: #ffffff; }
        .section-subtitle { font-size: 0.95rem; text-transform: uppercase; color: var(--accent-yellow); font-weight: bold; letter-spacing: 1px; margin-bottom: 0.3rem; text-align: center; }
        
        .content-card { background: var(--card-blue); border-radius: 16px; padding: 2rem 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.08); position: relative; }
        .card-header-area { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .card-icon-box { width: 50px; height: 50px; background: rgba(255,255,255,0.08); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--accent-yellow); font-size: 1.4rem; }
        .card-title { font-size: 1.3rem; font-weight: 800; color: #ffffff; }

        .card-actions { display: flex; gap: 1.5rem; font-weight: bold; }
        .action-link-yellow { color: var(--accent-yellow); text-decoration: none; display: flex; align-items: center; gap: 0.3rem; }
        .action-link-more { color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; opacity: 0.8; }

        .about-text { font-size: 1.1rem; line-height: 1.6; color: #e0e1dd; margin-bottom: 1.5rem; }
        
        .badge-row-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 2rem 0; }
        .graphic-badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1rem; border-radius: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; }

        .gallery-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        
        .slider-container { background: rgba(255,255,255,0.02); padding: 1rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 2rem; }

        .split-slider { display: flex; gap: 0.5rem; width: 100%; }
        .side-img { width: 50%; aspect-ratio: 1.2; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }

        .review-stars { color: var(--accent-yellow); margin-bottom: 0.5rem; font-size: 1.1rem; }

        .author-avatar { width: 42px; height: 42px; background: var(--btn-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }

        .area-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin-top: 1.5rem; }
        .area-pill { background: rgba(29, 112, 184, 0.15); border: 1px solid rgba(29, 112, 184, 0.3); padding: 0.8rem; border-radius: 8px; display: flex; align-items: center; gap: 0.5rem; font-weight: bold; font-size: 1rem; }

        .faq-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 1.2rem; margin-bottom: 0.8rem; }

        .scope-box { background: rgba(27, 38, 59, 0.7); border-radius: 12px; padding: 2rem 1.5rem; margin: 3rem 0; border: 1px solid rgba(255,255,255,0.05); }
        .checkbox-group { margin: 1rem 0; }

        .office-card { background:#112233; text-align:left; border:1px solid rgba(255,255,255,0.05); padding: 2rem 1.5rem; border-radius: 12px; margin-bottom: 2rem; margin-top: 3rem; }
        .office-row { font-size:1rem; color: #e0e1dd; margin-bottom: 0.5rem; display: flex; align-items: center; }
        .office-row i { color:#00b4d8; margin-right:8px; width: 20px; text-align: center; }

        .bottom-sticky-navbar { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; padding: 0.6rem 1rem; display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 0.6rem; border-top: 1px solid #e0e0e0; z-index: 2000; box-shadow: 0 -4px 10px rgba(0,0,0,0.15); }
        .nav-btn-call { background: #0056b3; color: #ffffff; border-radius: 6px; text-decoration: none; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; padding: 0.5rem 0; }
        .nav-btn-call i { font-size: 1.2rem; margin-bottom: 2px; }
        .nav-btn-book { background: var(--accent-yellow); color: #000000; border-radius: 6px; text-decoration: none; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 0.4rem; font-size: 1.1rem; text-transform: uppercase; border: none; }
        .nav-btn-review { background: #124076; color: #ffffff; border-radius: 6px; text-decoration: none; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; padding: 0.5rem 0; }
        .nav-btn-review i { font-size: 1.2rem; margin-bottom: 2px; color: var(--accent-yellow); }
