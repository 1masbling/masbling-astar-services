
name: Production Android Build and Image Watermark

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-watermark:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Sharp Image Processing Library
        run: |
          npm install sharp

      - name: Run Auto Watermark Script
        run: |
          node watermark.js

      - name: Commit and Push Watermarked Images Back to Repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          if [ -n "$(git status --porcelain images/showcase/)" ]; then
            git add images/showcase/
            git commit -m "chore: automatically added business logo watermarks [skip ci]"
            git push origin main
            echo "✅ Stamped images pushed back to GitHub."
          else
            echo "ℹ️ No new images found to push."
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Sign App Bundle
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore app/keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            app/build/outputs/bundle/release/app-release.aab "${{ secrets.KEY_ALIAS }}"
