<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masbling Astar Services | Instant Estimator</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-dark: #0F1D3A;
            --card-blue: #01519f;
            --accent-yellow: #FBBE02;
            --sky-blue: #30A6E0;
            --text-white: #FFFFFF;
            --body-bg: #f8fafc;
        }

        body {
            background-color: var(--body-bg);
            color: var(--bg-dark);
            line-height: 1.6;
        }

        /* Navigation Header */
        header {
            background-color: var(--bg-dark);
            color: var(--text-white);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-white);
            text-decoration: none;
        }

        .logo i {
            font-size: 2rem;
            color: var(--sky-blue);
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 4px;
            transition: background 0.3s;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Form Container layout */
        .form-wrapper {
            max-width: 650px;
            margin: 40px auto;
            background: var(--text-white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .form-header h2 {
            color: var(--card-blue);
            font-size: 24px;
            font-weight: bold;
        }

        .form-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 5px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--bg-dark);
            margin: 20px 0 10px 0;
        }

        /* Service Cards Inside Calculator */
        .service-item {
            background: #fafafa;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .service-item:hover {
            border-color: var(--sky-blue);
        }

        .service-main-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .checkbox-container {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            width: 75%;
        }

        .checkbox-container input[type="checkbox"] {
            margin-top: 4px;
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .service-name {
            font-weight: 600;
            color: #1e293b;
            font-size: 15px;
        }

        .service-desc {
            color: #64748b;
            font-size: 12px;
            display: block;
            margin-top: 2px;
        }

        .service-price {
            font-weight: 700;
            color: var(--card-blue);
            font-size: 15px;
            text-align: right;
            width: 25%;
        }

        /* Dynamic Options Panels */
        .service-options {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #e2e8f0;
            padding-left: 28px;
            display: none;
        }

        .service-options.active {
            display: block;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }

        .input-group select, .input-group input {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            color: var(--bg-dark);
            outline: none;
        }

        .input-group select:focus, .input-group input:focus {
            border-color: var(--sky-blue);
        }

        .custom-badge {
            font-size: 12px;
            color: #ef4444;
            font-weight: 600;
            display: none;
        }

        /* Note Textarea */
        textarea.form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            outline: none;
            margin-bottom: 20px;
        }

        textarea.form-control:focus {
            border-color: var(--sky-blue);
        }

        /* Estimate Summary Window */
        .summary-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            color: var(--bg-dark);
            font-weight: bold;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--card-blue);
            color: var(--text-white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(1, 81, 159, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--bg-dark);
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            background: var(--bg-dark);
            color: var(--text-white);
            text-align: center;
            padding: 2rem 0;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">
                <i class="fas fa-star"></i>
                <h1>Masbling Astar</h1>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <h2>Select Your Project Scope</h2>
                <p>Check the boxes below to calculate your residential exterior service minimums</p>
            </div>

            <form id="estimatorForm">
                
                <div class="section-title">1. Maintenance & Cleaning</div>

                <!-- Service 1: Gutter Cleaning -->
                <div class="service-item">
                    <div class="service-main-row">
                        <label class="checkbox-container">
                            <input type="checkbox" id="chk-cleaning">
                            <div>
                                <span class="service-name">Professional Gutter Cleaning</span>
                                <span class="service-desc">Complete debris extraction and downspout flushing.</span>
                            </div>
                        </label>
                        <div class="service-price" id="text-cleaning">From $190.00</div>
                    </div>
                    <div class="service-options" id="opt-cleaning">
                        <div class="input-group">
                            <label for="cleaning-size">Select House Size:</label>
                            <select id="cleaning-size">
                                <option value="190">Small 1-Story Bungalow ($190.00)</option>
                                <option value="220">Two-Story House or Higher ($220.00)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Service 2: Window Cleaning -->
                <div class="service-item">
                    <div class="service-main-row">
                        <label class="checkbox-container">
                            <input type="checkbox" id="chk-window-clean" data-price="225">
                            <div>
