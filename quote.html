<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masbling Astar Services | Professional Quote Generator</title>
  <!-- Clean Isolated Tailwind Engine Integration -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F1D3A] text-white font-sans antialiased min-h-screen py-10 px-4 flex justify-center items-start">

  <!-- Main Isolated Card Container -->
  <div class="w-full max-w-xl bg-[#01519F] rounded-3xl p-6 sm:p-8 border border-white/10 shadow-2xl space-y-6">
    
    <!-- Branding Header Section -->
    <header class="text-center border-b border-white/10 pb-6 flex flex-col items-center">
      <img src="logo.png" alt="Masbling Astar Services Logo" class="h-24 w-auto object-contain mb-4 rounded-xl shadow-md" onerror="this.src='images/logo.png'; this.onerror=function(){this.style.display='none';};">
      <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-wider text-white">Select Project Scope</h1>
      <p class="text-xs text-[#FBBE02] font-black tracking-widest uppercase mt-1">Instant Upfront Flat-Rate Estimate</p>
    </header>

    <form id="astarEstimateForm" class="space-y-4" onsubmit="handleFormSubmit(event)">
      
      <!-- 1. Gutter Cleaning Baseline -->
      <div class="bg-black/30 p-4 rounded-xl border border-white/5 flex items-start justify-between">
        <div class="flex items-start">
          <input type="checkbox" id="gutter" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 rounded bg-slate-900 accent-[#FBBE02] cursor-pointer">
          <label for="gutter" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">Gutter Cleaning Baseline</label>
        </div>
        <span class="text-[#FBBE02] text-sm font-black whitespace-nowrap ml-4">Starts at $195</span>
      </div>

      <!-- 2. Soffit & Fascia Care -->
      <div class="bg-black/30 p-4 rounded-xl border border-white/5 flex items-start justify-between">
        <div class="flex items-start">
          <input type="checkbox" id="soffit" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 rounded bg-slate-900 accent-[#FBBE02] cursor-pointer">
          <label for="soffit" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">Soffit & Fascia Care</label>
        </div>
        <span class="text-[#FBBE02] text-sm font-black whitespace-nowrap ml-4">$170</span>
      </div>

      <!-- 3. Vent Replacement -->
      <div class="bg-black/30 p-4 rounded-xl border border-white/5 space-y-3">
        <div class="flex items-start justify-between">
          <div class="flex items-start">
            <input type="checkbox" id="vent" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 rounded bg-slate-900 accent-[#FBBE02] cursor-pointer">
            <label for="vent" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">Vent Replacement</label>
          </div>
          <span class="text-[#FBBE02] text-sm font-black whitespace-nowrap ml-4">$120 Base</span>
        </div>
        <div class="pl-8 flex justify-between items-center bg-black/40 p-2 rounded-lg text-xs">
          <span class="text-slate-300">Additional Vents ($30/each):</span>
          <input type="number" id="ventQuantity" min="0" value="0" oninput="handleQuantityInput('vent', this)" class="w-16 bg-[#0F1D3A] border border-white/20 rounded text-center py-1 font-bold text-white focus:border-[#FBBE02] focus:outline-none">
        </div>
      </div>

      <!-- 4. Eavestrough Repair -->
      <div class="bg-black/30 p-4 rounded-xl border border-white/5 space-y-3">
        <div class="flex items-start justify-between">
          <div class="flex items-start">
            <input type="checkbox" id="repair" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 rounded bg-slate-900 accent-[#FBBE02] cursor-pointer">
            <label for="repair" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">Eavestrough Repair (Leaks)</label>
          </div>
          <span class="text-[#FBBE02] text-sm font-black whitespace-nowrap ml-4">$170 Base</span>
        </div>
        <div class="pl-8 flex justify-between items-center bg-black/40 p-2 rounded-lg text-xs">
          <span class="text-slate-300">Extra Leaking Corners ($30/each):</span>
          <input type="number" id="cornerQuantity" min="0" value="0" oninput="handleQuantityInput('repair', this)" class="w-16 bg-[#0F1D3A] border border-white/20 rounded text-center py-1 font-bold text-white focus:border-[#FBBE02] focus:outline-none">
        </div>
      </div>

      <!-- 5. Window Caulking -->
      <div class="bg-black/30 p-4 rounded-xl border border-white/5 space-y-3">
        <div class="flex items-start justify-between">
          <div class="flex items-start">
            <input type="checkbox" id="caulking" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 rounded bg-slate-900 accent-[#FBBE02] cursor-pointer">
            <label for="caulking" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">Window Caulking Shields</label>
          </div>
          <span class="text-[#FBBE02] text-sm font-black whitespace-nowrap ml-4">$170 / window</span>
        </div>
        <div class="pl-8 flex justify-between items-center bg-black/40 p-2 rounded-lg text-xs">
          <span class="text-slate-300">Total Windows Count:</span>
          <input type="number" id="windowQuantity" min="0" value="0" oninput="handleQuantityInput('caulking', this)" class="w-16 bg-[#0F1D3A] border border-white/20 rounded text-center py-1 font-bold text-white focus:border-[#FBBE02] focus:outline-none">
        </div>
      </div>

      <!-- 6. Power Washing -->
      <div class="bg-black/30 p-4 rounded-xl border border-white/5 flex items-start justify-between">
        <div class="flex items-start">
          <input type="checkbox" id="powerwash" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 rounded bg-slate-900 accent-[#FBBE02] cursor-pointer">
          <label for="powerwash" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">Power Washing Solutions</label>
        </div>
        <span class="text-[#FBBE02] text-sm font-black whitespace-nowrap ml-4">$250</span>
      </div>

      <!-- 7. Heated Wires -->
      <div class="bg-black/30 p-4 rounded-xl border border-white/5 space-y-3">
        <div class="flex items-start justify-between">
          <div class="flex items-start">
            <input type="checkbox" id="heatedwires" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 rounded bg-slate-900 accent-[#FBBE02] cursor-pointer">
            <label for="heatedwires" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">Heated Wires Systems</label>
          </div>
          <span class="text-[#FBBE02] text-sm font-black whitespace-nowrap ml-4">$100 / 25 ft</span>
        </div>
        <div class="pl-8 flex justify-between items-center bg-black/40 p-2 rounded-lg text-xs">
          <span class="text-slate-300">Estimated Length Needed (ft):</span>
          <input type="number" id="wireLength" min="0" value="0" oninput="handleQuantityInput('heatedwires', this)" class="w-16 bg-[#0F1D3A] border border-white/20 rounded text-center py-1 font-bold text-white focus:border-[#FBBE02] focus:outline-none">
        </div>
      </div>

      <!-- 8. Christmas Lights -->
      <div class="bg-black/30 p-4 rounded-xl border border-white/5 flex items-start justify-between">
        <div class="flex items-start">
          <input type="checkbox" id="xmaslights" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 rounded bg-slate-900 accent-[#FBBE02] cursor-pointer">
          <label for="xmaslights" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">Seasonal Christmas Lights</label>
        </div>
        <span class="text-[#FBBE02] text-sm font-black whitespace-nowrap ml-4">Custom Quote</span>
      </div>

      <!-- Total Readout Section -->
      <div class="bg-black/40 rounded-xl border border-[#FBBE02] p-4 text-center">
        <span class="text-xs text-[#FBBE02] font-black uppercase tracking-widest block mb-1">Calculated Total</span>
        <div id="totalDisplay" class="text-4xl font-black text-white">$0</div>
      </div>

      <!-- Customer Information Input Block -->
      <div class="pt-4 border-t border-white/10 space-y-3">
        <h3 class="text-sm font-black tracking-wider text-[#30A6E0] uppercase">Customer Information</h3>
        <input type="text" id="custName" placeholder="Your Full Name" required class="w-full px-4 py-3 bg-[#0F1D3A] border border-white/10 rounded-xl text-white placeholder-slate-400 text-sm focus:border-[#FBBE02] focus:outline-none">
        <input type="tel" id="custPhone" placeholder="Phone Number" required class="w-full px-4 py-3 bg-[#0F1D3A] border border-white/10 rounded-xl text-white placeholder-slate-400 text-sm focus:border-[#FBBE02] focus:outline-none">
        <input type="text" id="custAddress" placeholder="Property Address" required class="w-full px-4 py-3 bg-[#0F1D3A] border border-white/10 rounded-xl text-white placeholder-slate-400 text-sm focus:border-[#FBBE02] focus:outline-none">
      </div>

      <!-- Submit Action Button -->
      <button type="submit" class="w-full bg-[#FBBE02] text-[#0F1D3A] font-black py-4 rounded-xl text-sm transition tracking-wider uppercase shadow-xl hover:bg-white cursor-pointer">
        Submit Request via WhatsApp
      </button>
    </form>
  </div>

  <script>
    function handleQuantityInput(checkboxId, inputEl) {
      const val = parseFloat(inputEl.value) || 0;
      const checkbox = document.getElementById(checkboxId);
      if (val > 0 && !checkbox.checked) {
        checkbox.checked = true;
