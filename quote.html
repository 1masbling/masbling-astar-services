<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masbling Astar Services - Quote Generator</title>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }
    .calculator-card {
      background-color: #0E3368;
      color: #ffffff;
      padding: 24px 16px;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border-top: 4px solid #0087BD;
      box-sizing: border-box;
    }
    .text-center { text-align: center; }
    .mb-6 { margin-bottom: 24px; }
    .space-y-4 > * + * { margin-top: 16px; }
    .service-row {
      background: rgba(255, 255, 255, 0.05);
      padding: 14px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
    }
    .flex-input {
      margin-left: 28px;
      margin-top: 8px;
      font-size: 13px;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="number"] {
      width: 60px;
      padding: 6px;
      border-radius: 4px;
      border: none;
      text-align: center;
      font-weight: bold;
      color: #000;
      background-color: #ffffff;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #ECAA11;
      cursor: pointer;
    }
    .label-text {
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.3;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      margin-top: 6px;
      margin-bottom: 12px;
      box-sizing: border-box;
      font-weight: 500;
      color: #000;
      background-color: #ffffff;
      display: block;
    }
    .btn-submit {
      width: 100%;
      background-color: #ECAA11;
      color: #000;
      font-weight: 900;
      padding: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 15px;
      margin-top: 16px;
      display: block;
    }
    .btn-submit:hover { background-color: #F1B51C; }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="text-center mb-6">
      <h2 style="margin:0; font-size:24px; text-transform:uppercase;">Select Project Scope</h2>
      <p style="margin:4px 0 0 0; font-size:11px; color:#d1d5db; text-transform:uppercase;">Instant Upfront Flat-Rate Estimate</p>
    </div>

    <form id="estimateForm" class="space-y-4">
      
      <!-- 1. Gutter Cleaning -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Gutter Cleaning & Maintenance" data-base="190">
          <span class="label-text">Gutter Cleaning & Maintenance (Starts at $190)</span>
        </label>
      </div>

      <!-- 2. Eavestrough & Downpipe Repair -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Eavestrough & Downpipe Repair" data-base="170">
          <span class="label-text">Eavestrough & Downpipe Repair ($170)</span>
        </label>
        <div class="flex-input">
          <span>+ Additional Vents ($120 setup + $30/ea):</span>
          <input type="number" id="extraVents" value="0" min="0">
        </div>
      </div>

      <!-- 3. Soffit & Fascia Care -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Soffit & Fascia Care" data-base="120">
          <span class="label-text">Soffit & Fascia Care ($120)</span>
        </label>
        <div class="flex-input">
          <span>+ Leaking Corners ($30 each additional):</span>
          <input type="number" id="extraCorners" value="0" min="0">
        </div>
      </div>

      <!-- 4. Window Caulking Shields -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Window Caulking Shields" data-base="0">
          <span class="label-text">Window Caulking Shields ($170 per window)</span>
        </label>
        <div class="flex-input">
          <span>Total windows needing caulking:</span>
          <input type="number" id="caulkingWindows" value="1" min="1">
        </div>
      </div>

      <!-- 5. Windows Cleaning -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Windows Cleaning" data-base="0">
          <span class="label-text">Windows Cleaning (10-12 Windows = $250)</span>
        </label>
        <div class="flex-input">
          <span>Total windows to clean:</span>
          <input type="number" id="totalWindowsClean" value="10" min="1">
        </div>
        <span style="font-size:10px; color:#9ca3af; margin-left:28px; display:block; margin-top:4px;">(+$30 for each window over 12)</span>
      </div>

      <!-- 6. Skylight Leak Repair -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Skylight Leak Repair" data-base="50">
          <span class="label-text">Skylight Leak (Starts at $50 - depends on floor)</span>
        </label>
      </div>

      <!-- 7. Power Wash -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Power Wash" data-base="250">
          <span class="label-text">Power Wash ($250 flat rate)</span>
        </label>
      </div>

      <!-- 8. Heated Wires -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Heated Wires Installation" data-base="100">
          <span class="label-text">Heated Wires Installation (Starts at $100 for 25 ft)</span>
        </label>
        <div class="flex-input">
          <span>Estimated length in feet:</span>
          <input type="number" id="heatedWiresFeet" value="25" min="25" step="25">
        </div>
      </div>

      <!-- 9. Christmas Lights -->
      <div class="service-row">
        <label style="display:flex; align-items:center; gap:10px; width:100%;">
          <input type="checkbox" name="services" value="Christmas Lights Installation" data-base="0">
          <span class="label-text">Christmas 🎄 Lights & Lighting (Custom Quote)</span>
        </label>
      </div>

      <!-- USER INFO CONTAINER -->
      <div style="padding-top:16px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 20px;">
        <label style="font-size:12px; color:#9ca3af; font-weight:bold; display:block; text-align:left;">FULL NAME</label>
        <input type="text" id="clientName" placeholder="John Doe" required class="input-field">
        
        <label style="font-size:12px; color:#9ca3af; font-weight:bold; display:block; text-align:left; margin-top:4px;">SELECT SERVICE LOCATION</label>
        <select id="clientLocation" required class="input-field">
          <option value="" disabled selected>Choose GTA Location...</option>
          <option value="Brampton">Brampton</option>
          <option value="Mississauga">Mississauga</option>
          <option value="Toronto">Toronto</option>
          <option value="Etobicoke">Etobicoke</option>
          <option value="Scarborough">Scarborough</option>
          <option value="Vaughan">Vaughan</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Request Upfront Estimate</button>
    </form>
  </div>

  <script>
    document.getElementById('estimateForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('clientName').value.trim();
      const location = document.getElementById('clientLocation').value;
      const checkedBoxes = document.querySelectorAll('input[name="services"]:checked');
      
      if (checkedBoxes.length === 0) {
        alert("Please select at least one item from the scope checklist.");
        return;
      }

      let totalEstimatedPrice = 0;
      let requiresCustomQuote = false;
      const selectedServicesText = [];

      checkedBoxes.forEach(cb => {
        const serviceName = cb.value;
        let basePrice = parseInt(cb.getAttribute('data-base'), 10);
        let itemBreakdown = '';

        if (serviceName === "Eavestrough & Downpipe Repair") {
          const extraVents = parseInt(document.getElementById('extraVents').value, 10) || 0;
          if (extraVents > 0) {
            const ventCost = 120 + (extraVents * 30);
            basePrice += ventCost;
            itemBreakdown = ` (Incl. ${extraVents} vents: +$${ventCost})`;
          }
        } 
        else if (serviceName === "Soffit & Fascia Care") {
          const extraCorners = parseInt(document.getElementById('extraCorners').value, 10) || 0;
          if (extraCorners > 0) {
            const cornerCost = extraCorners * 30;
            basePrice += cornerCost;
            itemBreakdown = ` (Incl. ${extraCorners} extra corners: +$${cornerCost})`;
          }
        } 
        else if (serviceName === "Window Caulking Shields") {
          const windows = parseInt(document.getElementById('caulkingWindows').value, 10) || 0;
          basePrice = windows * 170;
          itemBreakdown = ` (${windows} windows @ $170/ea)`;
