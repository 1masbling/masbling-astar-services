<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masbling Astar Services | Professional Quote Generator</title>
    <!-- Clean Isolated Tailwind Engine Integration -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F1D3A] text-white font-sans antialiased min-h-screen py-10 px-4 flex justify-center items-center">

    <!-- Main Isolated Card Container -->
    <div class="w-full max-w-xl bg-[#01519F] rounded-3xl p-6 sm:p-8 border border-white/10 shadow-2xl">
        
        <!-- Branding Header Section -->
        <header class="text-center border-b border-white/10 pb-6 flex flex-col items-center">
            <h1 class="text-2xl sm:text-3xl font-black tracking-wider text-white">Select Project</h1>
            <p class="text-xs text-[#FFBE02] font-black tracking-widest uppercase mt-1">Instant Upfront Floor Price Estimator</p>
        </header>

        <form id="astarEstimateForm" class="space-y-4" onsubmit="handleFormSubmit(event)">
            
            <!-- Gutter Cleaning -->
            <div class="bg-black/30 p-4 rounded-xl border border-white/5 flex items-center justify-between">
                <div class="flex items-start">
                    <input type="checkbox" id="gutter" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 accent-[#1d70b8] cursor-pointer">
                    <label for="gutter" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">
                        1. Gutter Cleaning Baseline
                        <span class="block text-[#FFBE02] text-sm font-bold tracking-widest uppercase mt-1">Starts at \$190/smart-pkg</span>
                    </label>
                </div>
            </div>

            <!-- Soffit & Fascia -->
            <div class="bg-black/30 p-4 rounded-xl border border-white/5 flex items-center justify-between">
                <div class="flex items-start">
                    <input type="checkbox" id="soffit" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 accent-[#1d70b8] cursor-pointer">
                    <label for="soffit" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">
                        2. Soffit & Fascia Care
                        <span class="block text-[#FFBE02] text-sm font-bold tracking-widest uppercase mt-1">Starts at \$195/span</span>
                    </label>
                </div>
            </div>

            <!-- Vent Replacement -->
            <div class="bg-black/30 p-4 rounded-xl border border-white/5 flex flex-col space-y-3">
                <div class="flex items-start justify-between">
                    <div class="flex items-start">
                        <input type="checkbox" id="vent" onchange="calculateAstarTotal()" class="w-5 h-5 mt-0.5 accent-[#1d70b8] cursor-pointer">
                        <label for="vent" class="ml-3 font-bold text-slate-100 cursor-pointer block text-sm sm:text-base">
                            3. Vent Replacement
                            <span class="block text-[#FFBE02] text-sm font-bold tracking-widest uppercase mt-1">Starts at \$120 Base/span</span>
                        </label>
                    </div>
                </div>
                <div class="pl-8 flex justify-between items-center bg-black/40 p-2 rounded-lg text-xs">
                    <span class="text-slate-300">Additional Vents ($30/each):</span>
                    <input type="number" id="ventQuantity" min="0" value="0" oninput="handleQuantityInput('vent', 'ventQuantity')" class="w-16 bg-black/50 border border-white/20 text-center rounded py-1 font-bold text-[#FFBE02]">
                </div>
            </div>

            <!-- Total Readout Section -->
            <div class="bg-black/40 rounded-xl border border-[#FFBE02] p-4 text-center">
                <span class="text-xs text-[#FFBE02] font-black uppercase tracking-widest block mb-1">Calculated Estimate</span>
                <div id="totalDisplay" class="text-4xl font-black text-white">$0.00</div>
            </div>

            <!-- Customer Data Intake -->
            <div class="pt-4 border-t border-white/10 space-y-3">
                <h3 class="text-sm font-black tracking-wider text-[#30A6E0] uppercase">Customer Information</h3>
                <input type="text" id="custName" placeholder="Your Full Name" required class="w-full px-4 py-3 bg-black/40 border border-white/10 rounded-xl text-sm focus:outline-none focus:border-[#30A6E0]">
                <input type="tel" id="custPhone" placeholder="Phone Number" required class="w-full px-4 py-3 bg-black/40 border border-white/10 rounded-xl text-sm focus:outline-none focus:border-[#30A6E0]">
                <input type="text" id="custAddress" placeholder="Property Address" required class="w-full px-4 py-3 bg-black/40 border border-white/10 rounded-xl text-sm focus:outline-none focus:border-[#30A6E0]">
            </div>

            <button type="submit" class="w-full bg-[#FFBE02] text-[#0F1D3A] font-black py-4 rounded-xl text-md hover:bg-[#e0a702] transition-colors uppercase tracking-wider shadow-md">
                Submit Request via WhatsApp
            </button>
        </form>
    </div>

    <script>
        function handleQuantityInput(checkboxId, inputId) {
            const val = parseInt(document.getElementById(inputId).value) || 0;
            const checkbox = document.getElementById(checkboxId);
            if (val > 0) {
                checkbox.checked = true;
            }
            calculateAstarTotal();
        }

        function calculateAstarTotal() {
            let totalCost = 0;

            if (document.getElementById('gutter').checked) totalCost += 190;
            if (document.getElementById('soffit').checked) totalCost += 195;

            if (document.getElementById('vent').checked) {
                let extraVents = parseInt(document.getElementById('ventQuantity').value) || 0;
                totalCost += 120;
                if (extraVents > 0) totalCost += (extraVents * 30);
            }

            document.getElementById('totalDisplay').innerText = '\$' + totalCost.toFixed(2);
            return totalCost;
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const finalPrice = calculateAstarTotal();

            let itemsSelected = [];
            if (document.getElementById('gutter').checked) itemsSelected.push("- Gutter Cleaning Baseline");
            if (document.getElementById('soffit').checked) itemsSelected.push("- Soffit & Fascia Care");
            if (document.getElementById('vent').checked) {
                let qty = parseInt(document.getElementById('ventQuantity').value) || 0;
                itemsSelected.push(`- Vent Replacement (Add'l units: ${qty})`);
            }

            const businessPhone = "14374404072";
            let msg = `*NEW ESTIMATE REQUEST - MASBLING ASTAR SERVICES*\n\n`;
            msg += `*Customer Details:*\n• Name: ${name}\n• Phone: ${phone}\n• Address: ${address}\n\n`;
            msg += `*Selected Project Scope:*\n${itemsSelected.join("\n")}\n\n`;
            msg += `*Estimated Flat Rate Total:* $${finalPrice.toFixed(2)}`;

            window.location.href = "https://wa.me"/ +businessPhone+ "?text=" + encodeURIComponent(msg);
        }
    </script>
</body>
</html>
