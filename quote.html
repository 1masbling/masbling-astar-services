<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masbling Astar Quote Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F1D3A] text-white font-sans antialiased min-h-screen w-full flex justify-center items-start py-6 px-3">
    <div class="w-full max-w-md bg-[#01519F] rounded-2xl p-4 border border-white/10 shadow-2xl">
        
        <header class="text-center border-b border-white/10 pb-4 mb-4 flex flex-col items-center">
            <h1 class="text-xl font-black tracking-wider">Select a Service</h1>
            <p class="text-[10px] text-[#FFBE02] font-black tracking-widest uppercase mt-0.5">Instant Upfront Multi-Select Calculator</p>
        </header>

        <form id="astarForm" class="space-y-4" onsubmit="sendAstar(event)">
            
            <!-- Standard form grid fields to guarantee reliable clicking on Samsung viewports -->
            <div class="bg-black/30 p-3 rounded-xl border border-white/5 flex flex-col space-y-3">
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5 border-b border-white/5">
                    <span>1. Downpipes Baseline</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">$190</span><input type="checkbox" id="srv1" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5 border-b border-white/5">
                    <span>2. Fascia Care</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">$195</span><input type="checkbox" id="srv2" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5 border-b border-white/5">
                    <span>3. Gutter Care</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">$190</span><input type="checkbox" id="srv3" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5 border-b border-white/5">
                    <span>4. Handyman Repair</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">Custom</span><input type="checkbox" id="srv4" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5 border-b border-white/5">
                    <span>5. Leaks Sealing</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">$170</span><input type="checkbox" id="srv5" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5 border-b border-white/5">
                    <span>6. Soffit Care</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">$195</span><input type="checkbox" id="srv6" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5 border-b border-white/5">
                    <span>7. Vent Replacement</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">$120</span><input type="checkbox" id="srv7" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5 border-b border-white/5">
                    <span>8. Window Caulking</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">$170</span><input type="checkbox" id="srv8" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
                <label class="flex items-center justify-between font-bold cursor-pointer py-1.5">
                    <span>9. Window Cleaning Bundle</span>
                    <div class="flex items-center"><span class="text-[#FFBE02] text-xs mr-3">$220</span><input type="checkbox" id="srv9" onchange="calcAstar()" class="w-5 h-5 accent-[#FFBE02]"></div>
                </label>
            </div>

            <!-- Counter Display Block -->
            <div class="bg-black/40 rounded-xl border border-[#FFBE02] p-3 text-center w-full">
                <span class="text-[10px] text-[#FFBE02] font-black uppercase tracking-widest block mb-0.5">Calculated Estimate</span>
                <div id="totalDisplay" class="text-3xl font-black text-white">$0.00</div>
            </div>

            <!-- Action Request Choices -->
            <div class="space-y-2 w-full">
                <h3 class="text-xs font-black tracking-wider text-[#30A6E0] uppercase">Select Request Action</h3>
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex items-center justify-center bg-black/30 border border-white/10 rounded-xl p-2.5 cursor-pointer font-bold text-xs select-none">
                        <input type="radio" name="reqType" value="Quote Only" checked class="w-4 h-4 accent-[#30A6E0]">
                        <span class="ml-2">Get Quote Link</span>
                    </label>
                    <label class="flex items-center justify-center bg-black/30 border border-[#FFBE02]/40 rounded-xl p-2.5 cursor-pointer font-bold text-xs select-none">
                        <input type="radio" name="reqType" value="Book Firm Slot Now" class="w-4 h-4 accent-[#FFBE02]">
                        <span class="ml-2 text-[#FFBE02]">⚡ Book Now</span>
                    </label>
                </div>
            </div>
            
            <!-- User Inputs -->
            <div class="space-y-2.5 w-full">
                <h3 class="text-xs font-black tracking-wider text-[#30A6E0] uppercase">Customer Information</h3>
                <input type="text" id="cName" placeholder="Your Full Name" required class="w-full px-3 py-2 bg-black/40 border border-white/10 rounded-xl text-sm text-white focus:outline-none">
                <input type="tel" id="cPhone" placeholder="Phone Number" required class="w-full px-3 py-2 bg-black/40 border border-white/10 rounded-xl text-sm text-white focus:outline-none">
                <input type="text" id="cAddr" placeholder="Property Address" required class="w-full px-3 py-2 bg-black/40 border border-white/10 rounded-xl text-sm text-white focus:outline-none">
            </div>
            
            <button type="submit" class="w-full bg-[#FFBE02] text-[#0F1D3A] font-black py-3 rounded-xl text-sm hover:bg-[#e0a702] uppercase tracking-wider font-bold shadow-md">Submit Request via WhatsApp</button>
        </form>
   
 <script>
        function calcAstar() {
            let total = 0;
            if (document.getElementById('srv1').checked) total += 190;
            if (document.getElementById('srv2').checked) total += 195;
            if (document.getElementById('srv3').checked) total += 190;
            if (document.getElementById('srv5').checked) total += 170;
            if (document.getElementById('srv6').checked) total += 195;
            if (document.getElementById('srv7').checked) total += 120;
            if (document.getElementById('srv8').checked) total += 170;
            if (document.getElementById('srv9').checked) total += 220;
            
            document.getElementById('totalDisplay').innerText = '$' + total.toFixed(2);
            return total;
        }

        function sendAstar(e) {
            e.preventDefault();
            const name = document.getElementById('cName').value.trim();
            const phone = document.getElementById('cPhone').value.trim();
            const addr = document.getElementById('cAddr').value.trim();
            const price = calcAstar();
            const actionType = document.querySelector('input[name="reqType"]:checked').value;
            
            let items = [];
            if (document.getElementById('srv1').checked) items.push("- Downpipes Service");
            if (document.getElementById('srv2').checked) items.push("- Fascia Care");
            if (document.getElementById('srv3').checked) items.push("- Gutter Care Baseline");
            if (document.getElementById('srv4').checked) items.push("- Handyman Custom Sweep");
            if (document.getElementById('srv5').checked) items.push("- Leaks Sealing Setup");
            if (document.getElementById('srv6').checked) items.push("- Soffit Care");
            if (document.getElementById('srv7').checked) items.push("- Vent Replacement");
            if (document.getElementById('srv8').checked) items.push("- Window Caulking Shields");
            if (document.getElementById('srv9').checked) items.push("- Premium Window Cleaning Bundle");
            
            let headline = (actionType === "Book Firm Slot Now") 
                ? "*URGENT FIRM BOOKING REQUEST - MASBLING ASTAR SERVICES* ⚡" 
                : "*NEW ESTIMATE REQUEST - MASBLING ASTAR SERVICES*";

            let msg = headline + "\n\n" +
                      "*Request Status:* " + actionType + "\n\n" +
                      "*Customer:*\n• Name: " + name + "\n• Phone: " + phone + "\n• Address: " + addr + "\n\n" +
                      "*Scope:*\n" + items.join("\n") + "\n\n" +
                      "*Total:* $" + price.toFixed(2);
                      
            window.location.href = "https://wa.me/14374404072?text= + encodeURIComponent(msg);
        }
    </script>
