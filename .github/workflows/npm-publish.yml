name: Android App Bundle Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build signed .aab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java Development Kit 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app (Vite)
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release App Bundle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: allthewayup$1Masbling
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: allthewayup$1Masbling

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-app-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
