name: Production Android Build and Image Watermark

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-watermark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Image Utilities
        run: |
          npm install sharp

      - name: Run Auto Watermark Script
        run: |
          node watermark.js

      - name: Commit and Push Watermarked Images Back to Repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          if [ -n "$(git status --porcelain images/showcase/)" ]; then
            git add images/showcase/
            git commit --allow-empty -m "chore: automatically added business logo watermarks [skip ci]"
            git push origin main
            echo "✅ Stamped images pushed back to GitHub."
          else
            echo "ℹ️ No new images found to push."
          fi

      - name: Setup Gradle 8.2 (Force Override)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Android App Bundle (AAB)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload Unsigned App Bundle for Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
