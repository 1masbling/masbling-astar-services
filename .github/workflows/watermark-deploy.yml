name: Production Android Build and Image Watermark

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-watermark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Sharp Image Processing Library
        run: npm install sharp

      - name: Run Auto Watermark Script
        run: node watermark.js

      - name: Commit and Push Watermarked Images Back to Repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          if [ -n "$(git status --porcelain images/showcase/)" ]; then
            git add images/showcase/
            git commit -m "Add watermarks to showcase images [skip ci]"
            git push
          else
            echo "No new images found to push."
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App Bundle (AAB)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Sign App Bundle with Production Key
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore android/app/upload-keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab "${{ secrets.KEY_ALIAS }}"

      - name: Upload Signed AAB Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: masbling-signed-app
          path: android/app/build/outputs/bundle/release/app-release.aab

